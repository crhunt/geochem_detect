data:
  data_path: babel-nebo/babel-nebo-lagsample-subset-labels.csv
  feature_columns:
    - Cu_ppm
    - Ni_ppm
    - Fe_pct
    - Au_ppb
    - Pt_ppb
    - Pd_ppb
  longitude: NORTHING
  latitude: EASTING
  label: label

# Default hyperparameters for IsolationForestDetector
# These values are also the class defaults in models/isolation_forest.py

model:
  n_estimators: 1000
  # Expected fraction of outliers; used by sklearn to set the decision threshold.
  contamination: 0.018
  max_features: 1.0
  random_state: 42
  n_jobs: -1

# Fraction of the full dataset used to define "rare" classes for anomaly labelling.
# A class is flagged as anomalous if its count is below contamination_threshold * N.
# At 0.01: threshold = 38 members -> 76 rare classes -> 9.7% of points anomalous.
evaluation:
  label: label
  #contamination_threshold: 0.05
  # Alternatively, specify exact label values directly:
  anomaly_labels: ['Pt_rich', 'Pd_rich', 'Au_rich', 'Fe_Ni_rich',
       'babel_nebo', 'Cu_rich']
  # Isolation Forest labels anomalies when decision_function < cutoff.
  cutoff: 0.0
