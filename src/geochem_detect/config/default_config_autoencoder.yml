data:
  data_path: gvirm/Data1.csv
  feature_columns:
    - SiO2n
    - TiO2n
    - Al2O3n
    - FeO*n
    - MnOn
    - MgOn
    - CaOn
    - Na2On
    - K2On
    - P2O5n
  longitude: long
  latitude: lat
  scale_features: true
  # normalize_by: some_reference_column

# Default hyperparameters for AutoencoderDetector
# These values are also the class defaults in models/autoencoder.py

model:
  encoding_dim: 4
  hidden_dims: [32, 16]
  dropout_rate: 0.2
  learning_rate: 0.001
  epochs: 50
  batch_size: 64
  validation_split: 0.1   # used only when no explicit val set is provided
  patience: 10

# Whether to include scaled lat/lon as auxiliary inputs to the encoder
training:
  spatial: false

evaluation:
  contamination_threshold: 0.01
  # Alternatively, specify exact label values directly:
  # anomaly_labels: ["label_a", "label_b"]
  # Score cutoff for flagging anomalies: mean + anomaly_sigma_cutoff * std
  # This is independent of contamination_threshold (which defines ground-truth rare classes).
  anomaly_sigma_cutoff: 2.0
