data:
  data_path: gvirm/multiclass_clean.csv
  feature_columns:
    - SIO2(WT%)
    - TIO2(WT%)
    - AL2O3(WT%)
    - FEOT(WT%)
    - CAO(WT%)
    - MGO(WT%)
    - MNO(WT%)
    - K2O(WT%)
    - NA2O(WT%)
    - P2O5(WT%)
  scale_features: true
  # normalize_by: some_reference_column

# Default hyperparameters for GeochemClassifier
# These values are also the class defaults in models/classifier.py

model:
  hidden_dims: [64, 32]
  dropout_rate: 0.3
  learning_rate: 0.001
  epochs: 100
  batch_size: 64
  validation_split: 0.15  # used only when no explicit val set is provided
  patience: 15
